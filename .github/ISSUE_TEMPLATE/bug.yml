name: Bug report
description: Something crashed or behaved unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Command you ran and output
      description: Please redact paths, commands and anything private.
  - type: input
    id: env
    attributes:
      label: OS, Node version, chafe version
